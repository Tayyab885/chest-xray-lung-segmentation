# data_layout.yaml with the globs rewritten for Kaggle mount paths, verified
# against the mounted tree rather than guessed.
#
# A Kaggle dataset mounts at /kaggle/input/datasets/<owner>/<slug>, not at
# /kaggle/input/<slug>, so data_root is /kaggle/input/datasets and every glob
# starts with the owner.
#
# The chest-xray-masks-and-labels mirror contains its own tree twice, once at
# "Lung Segmentation/" and once at "data/Lung Segmentation/". The globs anchor
# to the second. An unanchored pattern would match both and double every count.
montgomery:
  kaggle_slug: nikhilpandey360/chest-xray-masks-and-labels
  image_glob: "nikhilpandey360/chest-xray-masks-and-labels/data/Lung Segmentation/CXR_png/MCUCXR_*.png"
  # This mirror has no ManualMask/leftMask and rightMask directories. Both
  # sources' masks live in one flat masks/ directory, already merged into a
  # single file per radiograph.
  mask_globs:
    - "nikhilpandey360/chest-xray-masks-and-labels/data/Lung Segmentation/masks/{stem}_mask.png"
  expected_count: 138

shenzhen:
  kaggle_slug: nikhilpandey360/chest-xray-masks-and-labels
  image_glob: "nikhilpandey360/chest-xray-masks-and-labels/data/Lung Segmentation/CXR_png/CHNCXR_*.png"
  mask_globs:
    - "nikhilpandey360/chest-xray-masks-and-labels/data/Lung Segmentation/masks/{stem}_mask.png"
  # The mirror ships 662 Shenzhen radiographs and 566 masks. The 96 without a
  # segmentation cannot be trained on or scored, so the study is the annotated
  # subset. Declared rather than inferred: build_manifest checks both numbers,
  # so a mirror that loses more masks fails instead of quietly shrinking.
  expected_count: 566
  expected_unmasked: 96

jsrt:
  kaggle_slug: abduzzami/jsrt-247-image-lung-segmentation-mask-dataset
  # The content/jsrt/ nesting is in the uploaded dataset itself, so it is
  # present on the Kaggle mount as well as in the local download.
  image_glob: "abduzzami/jsrt-247-image-lung-segmentation-mask-dataset/content/jsrt/cxr/*.png"
  mask_globs:
    - "abduzzami/jsrt-247-image-lung-segmentation-mask-dataset/content/jsrt/masks/{stem}.png"
  expected_count: 247
